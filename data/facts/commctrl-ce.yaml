- {id: "commctrl-ce-C-TVS_DISABLEDRAGDROP", kind: "constant", class: "common", status: "verify-runtime", introduced: "~", target_header: "commctrl.h", src: ["mingw-org-w32api"], value: "16", definition: "#define TVS_DISABLEDRAGDROP 16", notes: "Documented on CE page \"Tree View Styles\" (ce50). Prevents the tree view control from sending TVN_BEGINDRAG notification messages. value from public-domain w32api lineage only; not stated in current desktop docs"}
- {id: "commctrl-ce-C-TVS_EDITLABELS", kind: "constant", class: "common", status: "verify-runtime", introduced: "~", target_header: "commctrl.h", src: ["mingw-org-w32api"], value: "8", definition: "#define TVS_EDITLABELS 8", notes: "Documented on CE page \"Tree View Styles\" (ce50). Enables the user to edit the labels of tree view items. value from public-domain w32api lineage only; not stated in current desktop docs"}
- {id: "commctrl-ce-C-TVS_HASBUTTONS", kind: "constant", class: "common", status: "verify-runtime", introduced: "~", target_header: "commctrl.h", src: ["mingw-org-w32api"], value: "1", definition: "#define TVS_HASBUTTONS 1", notes: "Documented on CE page \"Tree View Styles\" (ce50). Displays plus (+) and minus (-) buttons next to parent items. value from public-domain w32api lineage only; not stated in current desktop docs"}
- {id: "commctrl-ce-C-TVS_HASLINES", kind: "constant", class: "common", status: "verify-runtime", introduced: "~", target_header: "commctrl.h", src: ["mingw-org-w32api"], value: "2", definition: "#define TVS_HASLINES 2", notes: "Documented on CE page \"Tree View Styles\" (ce50). Uses lines to show the hierarchy of items. value from public-domain w32api lineage only; not stated in current desktop docs"}
- {id: "commctrl-ce-C-TVS_LINESATROOT", kind: "constant", class: "common", status: "verify-runtime", introduced: "~", target_header: "commctrl.h", src: ["mingw-org-w32api"], value: "4", definition: "#define TVS_LINESATROOT 4", notes: "Documented on CE page \"Tree View Styles\" (ce50). Uses lines to link items at the root of the tree view control. value from public-domain w32api lineage only; not stated in current desktop docs"}
- {id: "commctrl-ce-C-TVS_RTLREADING", kind: "constant", class: "common", status: "verify-runtime", introduced: "~", target_header: "commctrl.h", src: ["mingw-org-w32api"], value: "64", definition: "#define TVS_RTLREADING 64", notes: "Documented on CE page \"Tree View Styles\" (ce50). Causes text to be displayed from right-to-left (RTL). value from public-domain w32api lineage only; not stated in current desktop docs"}
- {id: "commctrl-ce-C-TVS_SHOWSELALWAYS", kind: "constant", class: "common", status: "verify-runtime", introduced: "~", target_header: "commctrl.h", src: ["mingw-org-w32api"], value: "32", definition: "#define TVS_SHOWSELALWAYS 32", notes: "Documented on CE page \"Tree View Styles\" (ce50). Uses the system highlight colors to draw the selected item. value from public-domain w32api lineage only; not stated in current desktop docs"}
- {id: "commctrl-ce-C-TVS_SINGLEEXPAND", kind: "constant", class: "common", status: "verify-runtime", introduced: "~", target_header: "commctrl.h", src: ["mingw-org-w32api"], value: "1024", definition: "#define TVS_SINGLEEXPAND 1024", notes: "Documented on CE page \"Tree View Styles\" (ce50). Specifies that when a new tree view item is selected, the selected item will automatically expand and the previously selected item will collapse. value from public-domain w32api lineage only; not stated in current desktop docs"}
- {id: "commctrl-ce-C-UDS_ALIGNLEFT", kind: "constant", class: "common", status: "verify-runtime", introduced: "~", target_header: "commctrl.h", src: ["mingw-org-w32api"], value: "8", definition: "#define UDS_ALIGNLEFT 8", notes: "Documented on CE page \"Up-down Control Styles\" (ce50). Positions the up-down control next to the left edge of the buddy window. value from public-domain w32api lineage only; not stated in current desktop docs"}
- {id: "commctrl-ce-C-UDS_ALIGNRIGHT", kind: "constant", class: "common", status: "verify-runtime", introduced: "~", target_header: "commctrl.h", src: ["mingw-org-w32api"], value: "4", definition: "#define UDS_ALIGNRIGHT 4", notes: "Documented on CE page \"Up-down Control Styles\" (ce50). Positions the up-down control next to the right edge of the buddy window. value from public-domain w32api lineage only; not stated in current desktop docs"}
- {id: "commctrl-ce-C-UDS_ARROWKEYS", kind: "constant", class: "common", status: "verify-runtime", introduced: "~", target_header: "commctrl.h", src: ["mingw-org-w32api"], value: "32", definition: "#define UDS_ARROWKEYS 32", notes: "Documented on CE page \"Up-down Control Styles\" (ce50). Causes the up-down control to process the UP ARROW and DOWN ARROW keys on the keyboard. value from public-domain w32api lineage only; not stated in current desktop docs"}
- {id: "commctrl-ce-C-UDS_AUTOBUDDY", kind: "constant", class: "common", status: "verify-runtime", introduced: "~", target_header: "commctrl.h", src: ["mingw-org-w32api"], value: "16", definition: "#define UDS_AUTOBUDDY 16", notes: "Documented on CE page \"Up-down Control Styles\" (ce50). Automatically elects the previous window in the z-order as the up-down control's buddy window. value from public-domain w32api lineage only; not stated in current desktop docs"}
- {id: "commctrl-ce-C-UDS_HORZ", kind: "constant", class: "common", status: "verify-runtime", introduced: "~", target_header: "commctrl.h", src: ["mingw-org-w32api"], value: "64", definition: "#define UDS_HORZ 64", notes: "Documented on CE page \"Up-down Control Styles\" (ce50). Causes the up-down control's arrows to point left and right instead of up and down. value from public-domain w32api lineage only; not stated in current desktop docs"}
- {id: "commctrl-ce-C-UDS_NOTHOUSANDS", kind: "constant", class: "common", status: "verify-runtime", introduced: "~", target_header: "commctrl.h", src: ["mingw-org-w32api"], value: "128", definition: "#define UDS_NOTHOUSANDS 128", notes: "Documented on CE page \"Up-down Control Styles\" (ce50). Prevents insertion of a thousands separator between every three decimal positions. value from public-domain w32api lineage only; not stated in current desktop docs"}
- {id: "commctrl-ce-C-UDS_SETBUDDYINT", kind: "constant", class: "common", status: "verify-runtime", introduced: "~", target_header: "commctrl.h", src: ["mingw-org-w32api"], value: "2", definition: "#define UDS_SETBUDDYINT 2", notes: "Documented on CE page \"Up-down Control Styles\" (ce50). Causes the up-down control to set the text of the buddy window, using the WM_SETTEXT message, when the position changes. value from public-domain w32api lineage only; not stated in current desktop docs"}
- {id: "commctrl-ce-C-UDS_WRAP", kind: "constant", class: "common", status: "verify-runtime", introduced: "~", target_header: "commctrl.h", src: ["mingw-org-w32api"], value: "1", definition: "#define UDS_WRAP 1", notes: "Documented on CE page \"Up-down Control Styles\" (ce50). Causes the position to wrap if it is incremented or decremented beyond the end or beginning of the range. value from public-domain w32api lineage only; not stated in current desktop docs"}
